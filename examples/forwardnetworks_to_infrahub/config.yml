---
# Forward Networks -> Infrahub.
#
# Targets the Infrahub schema library (base + the location_site, vlan, vrf, cable
# and lag extensions) plus the small extension this package ships (cloud kinds, OS
# releases and CVEs). Load them with ./infrahub-schema-load.sh before
# `forward-infrahub plan`.
name: from-forwardnetworks

source:
  name: forwardnetworks
  settings:
    # url, username, password and network_id fall back to FORWARD_URL,
    # FORWARD_USERNAME, FORWARD_PASSWORD and FORWARD_NETWORK_ID.
    url: "https://fwd.app"
    network_id: "<NETWORK-ID>"
    # latestProcessed | latestCollected | an explicit snapshot id.
    # latestCollected skips a snapshot that processed but collected nothing.
    snapshot_id: latestProcessed
    verify_ssl: true
    # Narrow which devices this sync owns. Empty means every device.
    device_vendors: []
    device_types: []
    device_models: []
    cloud_types: []
    cloud_account_ids: []
    # Where `forward-infrahub publish-queries` puts the bundled queries.
    # Publishing them enables snapshot diffs; until then they run inline.
    query_directory: /forward_infrahub
    query_mode: auto

destination:
  name: infrahub
  settings:
    url: "http://localhost:8000"
    # A CoreAccount named after source.name must exist: the destination marks
    # everything it writes with it, so operator edits stay distinguishable.

# infrahub-sync v3 never deletes: a plan records what Forward did not report and
# apply leaves it alone. Forward reports what it collected, and a device that
# failed collection looks exactly like one that was decommissioned. Read
# docs/safety.md. The flag below is what infrahub-sync 2.x read; v3 ignores it.
diffsync_flags:
  - SKIP_UNMATCHED_DST

incremental:
  full_resync_every: 20

order:
  - OrganizationManufacturer
  - DcimPlatform
  - DcimDeviceType
  # Optional: needs the OS support data; a device references its release, so the
  # releases load first. See DcimSoftwareVersion below.
  - DcimSoftwareVersion
  - LocationSite
  - BuiltinTag
  - DcimDevice
  # VLANs and LAGs before the interfaces that reference them: a reference to a
  # peer that has not been loaded drops the row that names it.
  - IpamNamespace
  - IpamVRF
  - IpamVLANGroup
  - IpamVLAN
  - InterfaceLag
  - InterfacePhysical
  - InterfaceVirtual
  - IpamPrefix
  - IpamIPAddress
  - DcimCable
  # Optional: needs the CVE data. See SecurityVulnerability below.
  - SecurityVulnerability
  - CloudAccount
  - CloudVPC
  - CloudSubnet
  - CloudService

schema_mapping:
  - name: OrganizationManufacturer
    mapping: nqe:manufacturers
    identifiers: [name]
    transforms:
      - field: name
        expression: "{{ name | title_vendor }}"
    fields:
      - name: name
        mapping: name

  - name: DcimPlatform
    mapping: nqe:platforms
    identifiers: [name]
    transforms:
      - field: manufacturer
        expression: "{{ manufacturer | title_vendor }}"
    fields:
      - name: name
        mapping: name
      - name: description
        static: "Discovered by Forward Networks"
      - name: manufacturer
        mapping: manufacturer
        reference: OrganizationManufacturer

  - name: DcimDeviceType
    # DcimDeviceType.name is unique on its own in the schema library. If two of
    # your vendors ship the same model string, prefix the vendor here and in
    # DcimDevice.device_type: "{{ manufacturer | title_vendor }} {{ name }}".
    mapping: nqe:device_types
    identifiers: [name]
    transforms:
      - field: manufacturer
        expression: "{{ manufacturer | title_vendor }}"
    fields:
      - name: name
        mapping: name
      - name: height
        static: 1
      - name: full_depth
        static: true
      - name: manufacturer
        mapping: manufacturer
        reference: OrganizationManufacturer

  - name: LocationSite
    # Forward returns the organisation's whole location catalogue, not the sites
    # this network uses: on a 37-device network that is 402 locations, 389 of
    # them empty. scope_devices lists the devices Forward placed at a site, so
    # this keeps the ones actually in use. Remove the filter to import the full
    # catalogue.
    mapping: nqe:locations
    identifiers: [name]
    filters:
      - field: scope_devices
        operation: is_not_empty
    fields:
      - name: name
        mapping: name
      - name: status
        static: active
      - name: description
        mapping: description
      - name: physical_address
        mapping: physical_address

  # Tags Forward already carries. One node per name, from the same execution
  # the device rows come from, so this costs no extra query.
  - name: BuiltinTag
    mapping: nqe:tags
    identifiers: [name]
    fields:
      - name: name
        mapping: tag

  - name: DcimDevice
    mapping: nqe:devices
    identifiers: [name]
    transforms:
      # A device with no reported OS version has no release to link.
      - field: software_version
        expression: "{{ platform ~ ' ' ~ os_version if os_version else none }}"
    # LocationSite is required on a device, and Forward does not always know one.
    filters:
      - field: location
        operation: is_not_empty
    fields:
      - name: name
        mapping: name
      - name: status
        static: active
      - name: rack_face
        static: front
      - name: serial_number
        mapping: serial_number
      - name: description
        mapping: description
      - name: device_type
        mapping: model
        reference: DcimDeviceType
      - name: platform
        mapping: platform
        reference: DcimPlatform
      - name: location
        mapping: location
        reference: LocationSite
      - name: tags
        mapping: tags
        reference: BuiltinTag
      # The release this device runs, named as the DcimSoftwareVersion rows are: the
      # OS family and the version. Optional with that mapping, which must load first.
      - name: software_version
        mapping: software_version
        reference: DcimSoftwareVersion

  # LAGs first: a member references its aggregate, and a reference to a peer
  # that has not been loaded drops the whole row.
  - name: InterfaceLag
    mapping: nqe:interfaces
    identifiers: [device, name]
    filters:
      - field: kind
        operation: "=="
        value: lag
    transforms:
      - field: status
        expression: "{{ admin_up | interface_status(oper_up) }}"
      - field: l2_mode
        expression: "{{ mode | l2_mode }}"
    fields:
      - name: name
        mapping: name
      - name: description
        mapping: description
      - name: status
        mapping: status
      - name: mtu
        mapping: mtu
      - name: bundle_number
        mapping: lag_number
      - name: l2_mode
        mapping: l2_mode
      # The VLAN keys the adapter built after collapsing site-name variants.
      - name: untagged_vlan
        mapping: untagged_vlan
        reference: IpamVLAN
      - name: tagged_vlan
        mapping: tagged_vlans
        reference: IpamVLAN
      - name: device
        mapping: device
        reference: DcimDevice

  - name: InterfacePhysical
    mapping: nqe:interfaces
    identifiers: [device, name]
    filters:
      - field: kind
        operation: "=="
        value: physical
    transforms:
      - field: status
        expression: "{{ admin_up | interface_status(oper_up) }}"
      # Infrahub upper-cases a MacAddress on write. Forward reports it lower
      # case, so without this every interface differs from itself on the next
      # run and is rewritten: 1,986 of them on the network this was found on.
      # Matching Infrahub's form here is what makes the sync idempotent.
      # An interface with no MAC reports null, and null stays null: Infrahub's
      # MacAddress rejects an empty string, which is what ``| upper`` of nothing
      # would otherwise leave behind.
      - field: mac_address
        expression: "{{ mac_address | upper if mac_address else none }}"
      - field: l2_mode
        expression: "{{ mode | l2_mode }}"
    fields:
      - name: name
        mapping: name
      - name: description
        mapping: description
      - name: status
        mapping: status
      - name: mtu
        mapping: mtu
      - name: mac_address
        mapping: mac_address
      - name: l2_mode
        mapping: l2_mode
      # The VLAN keys the adapter built after collapsing site-name variants.
      - name: untagged_vlan
        mapping: untagged_vlan
        reference: IpamVLAN
      - name: tagged_vlan
        mapping: tagged_vlans
        reference: IpamVLAN
      - name: bundle
        mapping: lag_key
        reference: InterfaceLag
      - name: device
        mapping: device
        reference: DcimDevice

  - name: InterfaceVirtual
    mapping: nqe:interfaces
    identifiers: [device, name]
    filters:
      - field: kind
        operation: "=="
        value: virtual
    transforms:
      - field: status
        expression: "{{ admin_up | interface_status(oper_up) }}"
      - field: l2_mode
        expression: "{{ mode | l2_mode }}"
    fields:
      - name: name
        mapping: name
      - name: description
        mapping: description
      - name: status
        mapping: status
      - name: mtu
        mapping: mtu
      - name: l2_mode
        mapping: l2_mode
      # The VLAN keys the adapter built after collapsing site-name variants.
      - name: untagged_vlan
        mapping: untagged_vlan
        reference: IpamVLAN
      - name: tagged_vlan
        mapping: tagged_vlans
        reference: IpamVLAN
      - name: device
        mapping: device
        reference: DcimDevice

  - name: IpamNamespace
    # One namespace per Forward network instance, plus the built-in default.
    # Prefix and address uniqueness is per namespace, and the same subnet in two
    # VRFs is ordinary in collected data.
    mapping: nqe:ip_namespaces
    identifiers: [name]
    fields:
      - name: name
        mapping: name

  - name: IpamVRF
    mapping: nqe:vrfs
    identifiers: [name]
    fields:
      - name: name
        mapping: name

  - name: IpamVLANGroup
    # One group per site, so a VLAN id is unique within the site that uses it.
    # Filtered like LocationSite, since a group scoped to a site with no devices
    # has nothing to hold.
    mapping: nqe:locations
    identifiers: [name]
    filters:
      - field: scope_devices
        operation: is_not_empty
    fields:
      - name: name
        mapping: name
      - name: scope
        mapping: name
        reference: LocationSite

  - name: IpamVLAN
    # IpamVLAN inherits a human-friendly id of name alone, so Infrahub treats
    # two VLANs with the same name as the same node however they are scoped.
    # A real network had 127 VLANs under 57 names, and an unqualified name
    # silently merged them down to 57: not rejected, merged, each write
    # rewriting the previous one's id and group.
    #
    # So the name is built from the id and the site, which identify it, and
    # the name Forward reports is kept in description. The Forward name is
    # deliberately not part of it: a site's VLAN name is whichever of the
    # reporting devices' names sorts first, so putting it in the identity
    # would make that identity depend on which devices are in scope. An
    # interface that carries this VLAN has to name it, and it can build
    # "VLAN <id> @ <site>" without knowing what any other device called it.
    #
    # The identity is that name, because a write is keyed on the destination's
    # human-friendly id: identifying a VLAN by anything the id does not carry
    # leaves the write unkeyed, and a second run would make a second VLAN.
    mapping: nqe:vlans
    identifiers: [name]
    filters:
      - field: site
        operation: is_not_empty
    transforms:
      - field: qualified_name
        expression: "VLAN {{ vid }} @ {{ site }}"
    fields:
      - name: name
        mapping: qualified_name
      - name: description
        mapping: name
      - name: vlan_id
        mapping: vid
      - name: status
        static: active
      - name: vlan_group
        mapping: site
        reference: IpamVLANGroup

  - name: IpamPrefix
    mapping: nqe:prefixes
    identifiers: [prefix, ip_namespace]
    fields:
      - name: prefix
        mapping: prefix
      - name: status
        static: active
      - name: ip_namespace
        mapping: namespace
        reference: IpamNamespace
      - name: vrf
        mapping: vrf_ref
        reference: IpamVRF

  - name: IpamIPAddress
    mapping: nqe:ip_addresses
    identifiers: [address, ip_namespace]
    filters:
      - field: interface_kind
        operation: "=="
        value: physical
    fields:
      - name: address
        mapping: address
      - name: status
        static: active
      - name: description
        mapping: description
      - name: ip_namespace
        mapping: namespace
        reference: IpamNamespace
      - name: vrf
        mapping: vrf_ref
        reference: IpamVRF
      - name: interface
        mapping: interface_key
        reference: InterfacePhysical
      # Set from this side so devices do not have to wait for their addresses.
      # DcimGenericDevice is a generic and is never loaded; DcimDevice is the
      # only device kind this sync writes.
      - name: primary_of
        mapping: primary_of
        reference: DcimDevice

  # The same kind again, for addresses on virtual interfaces. A reference names
  # one kind; an address can sit on either, and a run probes the kinds every
  # entry of this name declares.
  - name: IpamIPAddress
    mapping: nqe:ip_addresses
    identifiers: [address, ip_namespace]
    filters:
      - field: interface_kind
        operation: "=="
        value: virtual
    fields:
      - name: address
        mapping: address
      - name: status
        static: active
      - name: description
        mapping: description
      - name: ip_namespace
        mapping: namespace
        reference: IpamNamespace
      - name: vrf
        mapping: vrf_ref
        reference: IpamVRF
      - name: interface
        mapping: interface_key
        reference: InterfaceVirtual
      - name: primary_of
        mapping: primary_of
        reference: DcimDevice

  - name: DcimCable
    mapping: nqe:cables
    identifiers: [label]
    fields:
      - name: label
        mapping: label
      - name: status
        static: connected
      # DcimEndpoint is a generic and is never loaded; a cable in Forward is
      # always between two ethernet ports, which are physical interfaces.
      - name: connected_endpoints
        mapping: connected_endpoints
        reference: InterfacePhysical

  # Optional. Remove this mapping, its entry in `order` and the `software_version`
  # field and transform of DcimDevice together: a device that references a release nothing loads
  # is skipped. Whether Forward returns the dates depends on the organization's
  # licence tier, and a tier without them does not refuse the query: Forward
  # empties those fields before it runs, so releases carry no dates.
  #
  # One row per OS release, not per device: the support dates belong to the
  # release, and the devices running it come with the row. Dates are absent for
  # vendors Forward has no lifecycle data for, which leaves the attribute unset.
  #
  # These are calendar dates and Infrahub's DateTime is an instant, shown in the
  # viewer's timezone. Midnight UTC reads as the day before everywhere west of
  # Greenwich, so the instant is noon UTC, which shows the same date from UTC-11
  # to UTC+11.
  - name: DcimSoftwareVersion
    mapping: nqe:software_versions
    identifiers: [name]
    transforms:
      - field: end_of_maintenance
        expression: "{{ end_of_maintenance ~ 'T12:00:00Z' if end_of_maintenance else none }}"
      - field: end_of_vulnerability_support
        expression: "{{ end_of_vulnerability_support ~ 'T12:00:00Z' if end_of_vulnerability_support else none }}"
      - field: end_of_support
        expression: "{{ end_of_support ~ 'T12:00:00Z' if end_of_support else none }}"
    fields:
      - name: name
        mapping: name
      - name: version
        mapping: version
      - name: end_of_maintenance
        mapping: end_of_maintenance
      - name: end_of_vulnerability_support
        mapping: end_of_vulnerability_support
      - name: end_of_support
        mapping: end_of_support
      - name: announcement_url
        mapping: announcement_url
      - name: platform
        mapping: platform
        reference: DcimPlatform
      # The devices running a release are not listed here. A device has one
      # release, so the link is written from the device (see DcimDevice, field
      # software_version): written from this side, a device that moved to a new
      # release is refused, because Infrahub will not give it a second one, and
      # the new release is never created.

  # A CVE Forward confirmed on at least one device, with the devices it affects.
  # Forward also lists the CVEs it ruled out on a device's configuration; those
  # are not here. Optional: remove this mapping and its entry in `order`. Whether
  # Forward returns CVE data depends on the organization's licence tier, and a tier
  # without it does not refuse the query: Forward empties it, so this table comes
  # back empty, and the run warns when a network of ten or more devices has none.
  # A CVE that is no longer found stays in Infrahub, still linked to the devices it
  # was found on, until someone removes it: infrahub-sync v3 never deletes.
  - name: SecurityVulnerability
    mapping: nqe:vulnerabilities
    identifiers: [cve_id]
    transforms:
      - field: severity
        expression: "{{ severity | lower }}"
      - field: published
        expression: "{{ published ~ 'T12:00:00Z' if published else none }}"
    fields:
      - name: cve_id
        mapping: cve_id
      - name: severity
        mapping: severity
      - name: published
        mapping: published
      - name: cisa_kev
        mapping: cisa_kev
      - name: advisory_url
        mapping: advisory_url
      - name: devices
        mapping: scope_devices
        reference: DcimDevice

  - name: CloudAccount
    # cloud_type arrives as a bare token (aws, azure, gcp): the query normalises it
    # so the account_key on VPC and service rows matches this identity exactly.
    mapping: nqe:cloud_accounts
    identifiers: [cloud_type, account_id]
    fields:
      - name: cloud_type
        mapping: cloud_type
      - name: account_id
        mapping: account_id
      - name: name
        mapping: name

  - name: CloudVPC
    mapping: nqe:cloud_networks
    # The denormalised keys, not the relationships: a write is keyed on the
    # human-friendly id, and one that crosses a relationship cannot be
    # rendered. These are the same values the relationships resolve through.
    identifiers: [account_key, network_id]
    filters:
      - field: kind
        operation: "=="
        value: vpc
    fields:
      - name: network_id
        mapping: network_id
      - name: name
        mapping: name
      - name: cidrs
        mapping: cidrs
      - name: account_key
        mapping: account_key
      - name: account
        mapping: account_key
        reference: CloudAccount

  - name: CloudSubnet
    mapping: nqe:cloud_networks
    identifiers: [vpc_key, network_id]
    filters:
      - field: kind
        operation: "=="
        value: subnet
    fields:
      - name: network_id
        mapping: network_id
      - name: name
        mapping: name
      - name: cidrs
        mapping: cidrs
      - name: vpc_key
        mapping: vpc_key
      - name: vpc
        mapping: vpc_key
        reference: CloudVPC

  - name: CloudService
    mapping: nqe:cloud_services
    identifiers: [vpc_key, service_id]
    fields:
      - name: service_id
        mapping: service_id
      - name: name
        mapping: name
      - name: service_kind
        mapping: service_kind
      - name: vpc_key
        mapping: vpc_key
      - name: vpc
        mapping: vpc_key
        reference: CloudVPC
