name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # infrahub-sync v3 is an unreleased branch that moves most days. This runs
    # against whatever is at its head, so upstream drift is reported here
    # rather than discovered during somebody's sync.
    - cron: "17 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, the ceiling, and the versions between: infrahub-sync
        # supports neither below 3.10 nor 3.14, and the floor is what the type
        # checker targets.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-groups --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q -W error::UserWarning

  package:
    # The bundled queries and the identity rules are checked without a network,
    # so a change to either fails here rather than during somebody's sync.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --all-groups
      - name: Query contracts
        run: uv run forward-infrahub check-contracts
      - name: Package builds and ships its queries
        run: |
          uv build
          uv run python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          queries = sum(1 for n in names if n.endswith(".nqe"))
          assert queries == 15, f"expected 15 bundled queries in the wheel, found {queries}"
          assert any(n.endswith("schemas/forward_cloud.yml") for n in names), "schema missing"
          assert any(n.endswith("entry_points.txt") for n in names), "entry point missing"
          print(f"wheel carries {queries} queries, the schema and the entry point")
          PY

  upstream:
    # Keeping pace with infrahub-sync v3 rather than pinning away from it. A
    # failure here is upstream moving, not this package breaking, so it does
    # not gate a pull request.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Take infrahub-sync from the head of its branch
        run: uv lock --upgrade-package infrahub-sync
      - name: Report which commit that is
        run: uv run python -c "import importlib.metadata as m; print('infrahub-sync', m.version('infrahub-sync'))"
      # Not editable: the registered path resolves adapters from installed
      # distributions only, and an editable install is refused there.
      - run: uv sync --all-groups --no-editable
      - name: The adapter still resolves through its entry point
        # --no-sync, and before anything else runs: a plain `uv run` re-syncs the
        # project as editable, undoing the --no-editable install above, and the
        # installed-only loader then refuses the adapter because it is imported
        # from the source tree.
        run: |
          uv run --no-sync python - <<'PY'
          from infrahub_sync.plugin_loader import PluginLoader
          import forward_infrahub.capabilities as capabilities
          import infrahub_sync.configuration.capabilities as table

          resolved = PluginLoader.installed_only_loader().resolve("forwardnetworks")
          assert resolved.__name__ == "ForwardnetworksAdapter", resolved
          assert capabilities.ADAPTER_NAME in table.BUILTIN_ADAPTER_CAPABILITIES
          print(f"{resolved.__name__} resolves, and declares its capabilities")
          PY
      - name: Tests, against the installed package
        run: uv run --no-sync pytest -q
