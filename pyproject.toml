[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forward-infrahub"
dynamic = ["version"]
description = "Forward Networks source adapter for infrahub-sync"
readme = "README.md"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.14"
authors = [{ name = "Forward Networks", email = "support@forwardnetworks.com" }]
keywords = ["forward", "forward-networks", "infrahub", "infrahub-sync", "nqe", "diffsync"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = [
  # infrahub-sync v3 is unreleased: nothing on PyPI satisfies this yet. The
  # install that does is the git branch, declared under [tool.uv.sources]
  # below and in the README, and CI installs the branch head every run.
  "infrahub-sync>=3.0.0a1,<4",
  "diffsync>=2.1,<3",
  # Pinned exactly: the SDK is pre-1.0 and its surface is still moving.
  # 0.1.5 is a floor for a reason below it: a response body the SDK could not
  # parse raised pydantic's ValidationError, which is not a ForwardError and
  # so walked straight through every `except ForwardError` here. 0.1.6 is a
  # floor for a second reason: its NQE paging guard no longer misreads a
  # query whose rows look identical (`select {n: 1}`, an aggregate) as a
  # server-side stall, which earlier versions reported as a 250,000-row cap
  # this package built a sharding fallback around before learning the cap
  # was never real. The fallback stays, for a genuine stall or guard trip;
  # the number 250,000 does not appear in this codebase again.
  "forward-sdk==0.1.38",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "pyyaml>=6",
]

[tool.uv.sources]
infrahub-sync = { git = "https://github.com/opsmill/infrahub-sync", branch = "feature/v3-develop" }

[project.urls]
Homepage = "https://github.com/forwardnetworks/forward-infrahub"
Repository = "https://github.com/forwardnetworks/forward-infrahub"
Changelog = "https://github.com/forwardnetworks/forward-infrahub/blob/main/CHANGELOG.md"
Issues = "https://github.com/forwardnetworks/forward-infrahub/issues"

[project.scripts]
forward-infrahub = "forward_infrahub.cli:main"

[project.entry-points."infrahub_sync.adapters"]
forwardnetworks = "forward_infrahub.adapter"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  # Aligned with the range infrahub-sync v3 needs at runtime.
  "ruff>=0.15.5,<0.16",
  "mypy>=1.13",
  "types-PyYAML",
  "pre-commit>=4",
  # infrahubctl, for `examples/.../infrahub-schema-load.sh` and manual schema
  # work. infrahub-sync 3.0.0a4 narrowed its own base dependency from
  # `infrahub-sdk[all]` to bare `infrahub-sdk`, moving `[ctl]` into its own
  # `service` extra -- deliberately, on their side, to keep a base install
  # free of it. We still want the command; asking for it here rather than
  # depending on their choice keeps it ours to keep working.
  "infrahub-sdk[ctl]>=1.17,<2",
]

[tool.hatch.version]
path = "src/forward_infrahub/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/forward_infrahub", "examples", "tests", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.hatch.build.targets.wheel]
packages = ["src/forward_infrahub"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "B011", "PLC0415"]
"scripts/**" = ["PLR"]
# The imports are inside the functions on purpose: the module must import on
# an infrahub-sync that has no capability table, and report that rather than
# fail at import.
"src/forward_infrahub/capabilities.py" = ["PLC0415"]
# infrahub-sync v3 is a heavy import that a `check-contracts` run has no use
# for, and capabilities must be registered before its validation modules are
# read. Both want these imports where they are.
"src/forward_infrahub/runtime.py" = ["PLC0415"]
"src/forward_infrahub/cli.py" = ["PLC0415"]

[tool.mypy]
# No python_version pin: mypy runs on the interpreter in .venv. Pinning it to
# the 3.10 floor makes mypy parse third-party stubs with 3.10 syntax rules,
# which numpy's (pulled in transitively) do not satisfy. Ruff's
# target-version enforces the 3.10 floor for our own code instead.
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["diffsync", "diffsync.*", "infrahub_sync", "infrahub_sync.*", "infrahub_sdk", "infrahub_sdk.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
# infrahub-sync ships no type information: its mixins arrive as Any and its
# methods as untyped, so subclassing and calling them cannot be checked here.
module = ["forward_infrahub.adapter"]
disallow_subclassing_any = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: tests that hit a real Forward instance (need FORWARD_URL/USERNAME/PASSWORD/NETWORK_ID)",
  "infrahub: tests that need a local Infrahub (INFRAHUB_ADDRESS/INFRAHUB_API_TOKEN)",
  "slow: tests that shell out (a wheel build, say)",
]
addopts = "-m 'not live and not infrahub' -ra"
pythonpath = ["."]

[tool.coverage.run]
source = ["forward_infrahub"]
