[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forward-infrahub"
dynamic = ["version"]
description = "Forward Networks source adapter for infrahub-sync"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
authors = [{ name = "Forward Networks", email = "support@forwardnetworks.com" }]
keywords = ["forward", "forward-networks", "infrahub", "infrahub-sync", "nqe", "diffsync"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = [
  "infrahub-sync>=2.0,<2.1",
  # infrahub-sync's model generator decides a field's type with
  # isinstance(item, AttributeSchema), and infrahub-sdk 1.23.0 stopped the
  # read-side AttributeSchemaAPI subclassing that. Every field then falls
  # through to str and rejects its own value. Their issue #187, PR #188 open.
  # Below 1.23 the inheritance holds and the generator is correct.
  "infrahub-sdk[all]>=1.17,<1.23",
  "diffsync>=2.0,<3",
  # Pinned exactly: the SDK is pre-1.0 and its surface is still moving.
  "forward-sdk==0.1.4",
  "pydantic>=2.6,<3",
  "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/forwardnetworks/forward-infrahub"
Repository = "https://github.com/forwardnetworks/forward-infrahub"
Changelog = "https://github.com/forwardnetworks/forward-infrahub/blob/main/CHANGELOG.md"
Issues = "https://github.com/forwardnetworks/forward-infrahub/issues"

[project.scripts]
forward-infrahub = "forward_infrahub.cli:main"

[project.entry-points."infrahub_sync.adapters"]
forwardnetworks = "forward_infrahub.adapter"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.9",
  "mypy>=1.13",
  "types-PyYAML",
  "pre-commit>=4",
]

[tool.hatch.version]
path = "src/forward_infrahub/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/forward_infrahub", "examples", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/forward_infrahub"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "B011", "PLC0415"]
"scripts/**" = ["PLR"]
# Imports inside the probes: the point is to tolerate a missing dependency and
# to read the installed version rather than one bound at import time.
"src/forward_infrahub/environment.py" = ["PLC0415"]

[tool.mypy]
# No python_version pin: mypy runs on the interpreter in .venv. Pinning it to
# the 3.10 floor makes mypy parse third-party stubs with 3.10 syntax rules,
# which numpy's (pulled in transitively) do not satisfy. Ruff's
# target-version enforces the 3.10 floor for our own code instead.
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# The probe deliberately builds a schema object without validation, to ask the
# installed generator what it does rather than to read its source.
module = ["forward_infrahub.environment"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["diffsync", "diffsync.*", "infrahub_sync", "infrahub_sync.*", "infrahub_sdk", "infrahub_sdk.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
# infrahub-sync ships no type information: its mixins arrive as Any and its
# methods as untyped, so subclassing and calling them cannot be checked here.
module = ["forward_infrahub.adapter"]
disallow_subclassing_any = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: tests that hit a real Forward instance (need FORWARD_URL/USERNAME/PASSWORD/NETWORK_ID)",
  "infrahub: tests that need a local Infrahub (INFRAHUB_ADDRESS/INFRAHUB_API_TOKEN)",
  "slow: tests that shell out (a wheel build, say)",
]
addopts = "-m 'not live and not infrahub' -ra"
pythonpath = ["."]

[tool.coverage.run]
source = ["forward_infrahub"]
